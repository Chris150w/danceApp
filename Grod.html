<html><head><style class="vjs-styles-defaults">
      .video-js {
        width: 300px;
        height: 150px;
      }

      .vjs-fluid {
        padding-top: 56.25%
      }
    </style></head><body><header>
<link rel="stylesheet" href="phone.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://unpkg.com/7.css">
<script src="tempos.js"></script>
<script src="phonr.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/7.0.0/video.min.js" integrity="sha512-LiILFcpZ9QKSH41UkK59Zag/7enHzqjr5lO2M0wGqGn8W19A/x2rV3iufAHkEtrln+Bt+Zv1U6NlLIp+lEqeWQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</header>
	

<div class="window glass">
 <div class="title-bar">
  <div class="title-bar-text"> Example Dance</div>	
 </div>
 <div class="window-body has-space">
<video src="Me Gustas Tu.webm" id="vid" controls="" onkeydown="step(event)" ontimeupdate="looper(event)"></video>

<fieldset id="looperControl">

<div>  <input type="checkbox" id="slank"><label for="slank">Metronome</label> </div> 
<div> <label>Start</label> <input id="loopS" type="number" onkeydown=" this.value = beatFinder(event, this.value); startInBeats.innerHTML = tempo.findIndex( (food) => food == this.value)"> <div id="startInBeats"></div> </div>
<div> <label>End  </label> <input id="loopE" type="number" onkeydown=" this.value = beatFinder(event, this.value);  endInBeats.innerHTML = tempo.findIndex( (food) => food == this.value)""> <div id= "endInBeats"></div> </div>

 <div> <label>Speed</label> <input id="speed" type="range" onchange="speedUpdate()" min="0.1" max="1" step="0.1"> </div></fieldset>

 </div>
</div>



<div id="regreso">
</div>

</body></html>
